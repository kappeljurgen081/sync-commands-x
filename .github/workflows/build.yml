name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Velocity 4.3.x is compiled for Java 25, so the whole build runs on JDK 25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # BungeeCord module is skipped: its bungeecord-api 1.19 snapshot is no longer downloadable
      - name: Build Spigot and Velocity
        run: mvn -B package -DskipTests -pl synccommands-spigot,synccommands-velocity -am

      - uses: actions/upload-artifact@v4
        with:
          name: SyncCommands
          path: |
            synccommands-spigot/target/SyncCommands*.jar
            synccommands-velocity/target/SyncCommands*.jar
            !**/target/original-*.jar
